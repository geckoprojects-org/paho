# Mosquitto 2 configuration for the Paho broker tests (see test/broker/start-broker.sh).
# Paths are inside the container; test/broker/certs is mounted at /mosquitto/config/certs.

log_type error
log_type warning
log_type notice
log_type information
log_dest stdout

allow_anonymous true

# Plain MQTT. 18883 is also used by tests that expect an ssl:// connect to a plain port to fail.
listener 1883
listener 18883

# WebSocket (SERVER_WEBSOCKET_URI=ws://localhost:8080 in test.properties)
listener 8080
protocol websockets

# TLS with client authentication
listener 18884
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate true

# TLS, server authentication only (8883 is the default SERVER_SSL_PORT of the v5 tests,
# 18885 the one in the v3 test.properties)
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate false

listener 18885
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate false

listener 18886
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate false

# Certificate for a different host name, to simulate a man-in-the-middle: clients that verify
# the host name must refuse to connect.
listener 18887
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server-mitm.crt
keyfile /mosquitto/config/certs/server-mitm.key
require_certificate false
