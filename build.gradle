plugins {
  id "org.sonarqube" version "6.2.0.5505"
  id 'jacoco'
  id 'java'
}

// We need to define a repository for the root project, otherwise Jacoco dependencies cannot be resolved
repositories {
  mavenCentral()
}

subprojects {

    //  Apply plugin: 'jacoco' to all submodules JUnit tests are generated as generated/jacoco/test.exec
    apply plugin: 'jacoco'
    apply plugin: 'java'
    // We need to define a repository, otherwise Jacoco dependencies cannot be resolved
    repositories {
        mavenCentral()
    }

    // Exclude @Tag("perf") (slow) and @Tag("remote") (needs internet) tests from normal builds.
    test {
        useJUnitPlatform {
            excludeTags 'perf', 'remote'
        }
        // Gradle 9 fails `test` when it discovers no tests, e.g. in the client bundles, whose
        // tests live in the separate *.test modules (upstream layout).
        failOnNoDiscoveredTests = false
    }

    // The Paho tests are JUnit 4; they run on the JUnit Platform through the vintage engine.
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
        testImplementation 'org.junit.platform:junit-platform-launcher:1.14.2'
        testImplementation 'org.junit.vintage:junit-vintage-engine:5.14.2'
        testImplementation 'junit:junit:4.13.2'
    }
}

// Most upstream Paho tests need an MQTT broker on localhost:1883. `test` leaves those out, so new
// tests run in the normal build without being registered here; `brokerTest` runs everything
// against the broker of test/broker/start-broker.sh.
def brokerTests = [
    'org.eclipse.paho.client.mqttv3.test': [
        'org.eclipse.paho.client.mqttv3.test.automaticReconnect.AutomaticReconnectTest',
        'org.eclipse.paho.client.mqttv3.test.automaticReconnect.OfflineBufferingTest',
        'org.eclipse.paho.client.mqttv3.test.connectionLoss.ConnectionLossTest',
        'org.eclipse.paho.client.mqttv3.test.BasicSSLTest',
        'org.eclipse.paho.client.mqttv3.test.BasicTest',
        'org.eclipse.paho.client.mqttv3.test.Bug443142Test',
        'org.eclipse.paho.client.mqttv3.test.LiveTakeOverTest',
        'org.eclipse.paho.client.mqttv3.test.ModelTestCase',
        'org.eclipse.paho.client.mqttv3.test.PerSubscriptionMessageHandlerTest',
        'org.eclipse.paho.client.mqttv3.test.SendReceiveAsyncCallbackTest',
        'org.eclipse.paho.client.mqttv3.test.SendReceiveAsyncTest',
        'org.eclipse.paho.client.mqttv3.test.SendReceiveTest',
        'org.eclipse.paho.client.mqttv3.test.SSLSessionResumptionTest',
        'org.eclipse.paho.client.mqttv3.test.TLSHostnameVerificationTest',
        'org.eclipse.paho.client.mqttv3.test.WebSocketTest',
    ],
    'org.eclipse.paho.mqttv5.client.test': [
        'org.eclipse.paho.mqttv5.client.test.automaticReconnect.AutomaticReconnectTest',
        'org.eclipse.paho.mqttv5.client.test.automaticReconnect.OfflineBufferingTest',
        'org.eclipse.paho.mqttv5.client.test.automaticReconnect.TopicAliasReconnectTest',
        'org.eclipse.paho.mqttv5.client.test.connectionLoss.ConnectionLossTest',
        'org.eclipse.paho.mqttv5.client.test.BasicSSLTest',
        'org.eclipse.paho.mqttv5.client.test.BasicTest',
        'org.eclipse.paho.mqttv5.client.test.ClientIdTest',
        'org.eclipse.paho.mqttv5.client.test.PersistenceTests',
        'org.eclipse.paho.mqttv5.client.test.PublishTests',
        'org.eclipse.paho.mqttv5.client.test.SendReceiveAsyncTest',
        'org.eclipse.paho.mqttv5.client.test.ServerAssignedClientIdentifierTest',
        'org.eclipse.paho.mqttv5.client.test.SubscribeTests',
    ],
]
// findProject: on `./gradlew :<project>:<task>` the bnd workspace plugin includes only the
// projects that task needs.
brokerTests.each { projectName, testClasses ->
    findProject(":${projectName}")?.with {
        // bnd only knows testsrc=src/test/java; the upstream test resources (test.properties,
        // the UTF-8 sample text of MqttDataTypesTest, clientkeystore.jks) live in the Maven location.
        sourceSets.test.resources.srcDir 'src/test/resources'
        test {
            filter {
                testClasses.each { excludeTestsMatching it }
            }
        }
        tasks.register('brokerTest', Test) {
            description = 'Runs all tests against the broker started by test/broker/start-broker.sh.'
            group = 'verification'
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/brokerTest')
        }
    }
}

// Sonar setup — values come from gradle.properties (github_org, github_repository)
sonarqube {
  properties {
    property "sonar.projectName", github_repository
    property "sonar.projectKey", github_org + "-" + github_repository
    property "sonar.organization", github_org
    property "sonar.host.url", "https://sonarcloud.io"
    property "sonar.coverage.jacoco.xmlReportPaths", rootDir.toString() + "/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml"
  }
}

task codeCoverageReport(type: JacocoReport) {
    dependsOn(test)
    // Gather execution data from all subprojects for JUnit generated/jacoco/test.exec
    executionData fileTree(project.rootDir.absolutePath).include("**/**/*.exec")

    // Add all relevant sourcesets from the subprojects
    subprojects.each {
        sourceSets it.sourceSets.main
    }

    // Generate xml reports for tools like sonar and html for humans
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named("sonar") {
    dependsOn(codeCoverageReport)
}
