# Same bnd version as the other Gecko workspaces: bnd 7.3.0 shipped a regression in the -pom
# snapshot handling that broke bundle jar builds with the fennec library, fixed in 7.4.0.
bnd_version=7.4.0

# The bnd workspace plugin turns every root folder into a Gradle project; keep Gradle's own
# output and the broker test setup out.
bnd_exclude=build,test

# --- Project coordinates (single source of truth) ---
# Used by Gradle directly and imported into bnd via `-include` in cnf/ext/fennec.bnd.
github_org=geckoprojects-org
github_repository=paho
maven_group_id=org.geckoprojects.paho
